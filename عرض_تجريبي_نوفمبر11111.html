<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مجمع أنوار خيبر الطبي — عروض نوفمبر 11.11</title>

  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       1. CSS VARIABLES & RESET
       ========================================================================== */
    :root {
      --bg-current: #C85A32;
      --accent-current: #2EC4B6;
      --ease-luxury: cubic-bezier(0.77, 0, 0.18, 1);
      --ease-pop: cubic-bezier(0.22, 1.35, 0.36, 1);
      --stage-radius: 28px;
      --font-main: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-main);
      background-color: var(--bg-current);
      transition: background-color 0.7s var(--ease-luxury);
      color: #FFFFFF;
    }

    /* Outer Desktop Backdrop */
    .viewport-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-current);
      transition: background-color 0.7s var(--ease-luxury);
      padding: 0;
    }

    /* Ambient outer glow on desktop screens */
    .viewport-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0.38) 100%);
      pointer-events: none;
    }

    /* ==========================================================================
       2. 9:16 VERTICAL PHONE STAGE (INSTAGRAM REEL RATIO)
       ========================================================================== */
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: var(--stage-radius);
      background-color: #C85A32;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.14) inset;
      isolation: isolate;
      /* Responsive fluid font scaling relative to stage width */
      container-type: inline-size;
    }

    /* Desktop & Tablet 9:16 centering */
    @media (min-aspect-ratio: 10/16) {
      .viewport-wrapper {
        padding: 18px;
      }
      .stage {
        height: min(94vh, 920px);
        width: auto;
        aspect-ratio: 9 / 16;
      }
    }

    /* ==========================================================================
       3. SLIDE LAYERS & DIAGONAL WIPE
       ========================================================================== */
    .slides-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 96px 28px 115px;
      text-align: center;
      background-color: var(--slide-bg, #C85A32);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: 1;
      will-change: clip-path, opacity;
    }

    /* Studio Set Lighting: Lighter Studio Floor/Band + Soft Vignette */
    .slide::before {
      content: '';
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -4%;
      height: 31%;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.13) 0%,
        rgba(255, 255, 255, 0.06) 65%,
        rgba(0, 0, 0, 0.08) 100%
      );
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      transform: skewY(-2.5deg);
      pointer-events: none;
      z-index: 0;
    }

    .slide::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at 50% 44%,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(0, 0, 0, 0) 54%,
        rgba(0, 0, 0, 0.34) 100%
      );
      pointer-events: none;
      z-index: 0;
    }

    .slide.is-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      z-index: 2;
      clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
    }

    .slide.is-outgoing {
      opacity: 1;
      visibility: visible;
      z-index: 2;
      clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
    }

    .slide.is-entering {
      opacity: 1;
      visibility: visible;
      z-index: 3;
      animation: diagonalWipeIn 0.7s var(--ease-luxury) forwards;
    }

    /* Slanted edge sweeping from right-to-left (natural RTL forward flow) */
    @keyframes diagonalWipeIn {
      0% {
        clip-path: polygon(100% 0%, 104% 0%, 100% 100%, 96% 100%);
      }
      100% {
        clip-path: polygon(-22% 0%, 100% 0%, 100% 100%, 0% 100%);
      }
    }

    .slide.is-entering-reverse {
      opacity: 1;
      visibility: visible;
      z-index: 3;
      animation: diagonalWipeInReverse 0.7s var(--ease-luxury) forwards;
    }

    @keyframes diagonalWipeInReverse {
      0% {
        clip-path: polygon(-4% 0%, 0% 0%, 4% 100%, 0% 100%);
      }
      100% {
        clip-path: polygon(0% 0%, 122% 0%, 100% 100%, 0% 100%);
      }
    }

    /* ==========================================================================
       4. DECORATIVE STUDIO SHAPES & ECG LINE
       ========================================================================== */
    .decor-layer {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      overflow: hidden;
    }

    .decor-circle {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: radial-gradient(circle, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
      animation: floatSlow 7s ease-in-out infinite;
    }

    .decor-circle.c1 {
      width: 210px;
      height: 210px;
      top: 13%;
      left: -65px;
    }

    .decor-circle.c2 {
      width: 150px;
      height: 150px;
      bottom: 20%;
      right: -45px;
      animation-delay: -3.2s;
    }

    .decor-plus {
      position: absolute;
      font-weight: 800;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.28);
      line-height: 1;
      animation: floatPlus 5.5s ease-in-out infinite;
    }

    .decor-plus.p1 { top: 20%; right: 14%; }
    .decor-plus.p2 { top: 64%; left: 13%; font-size: 13px; animation-delay: -1.8s; }
    .decor-plus.p3 { bottom: 26%; right: 20%; font-size: 12px; animation-delay: -3.5s; }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-10px) scale(1.03); }
    }

    @keyframes floatPlus {
      0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.25; }
      50% { transform: translateY(-7px) rotate(15deg); opacity: 0.48; }
    }

    /* Animated SVG Heartbeat / ECG Line */
    .ecg-container {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 24.5%;
      height: 44px;
      opacity: 0.24;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ecg-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .ecg-path {
      fill: none;
      stroke: #FFFFFF;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 460;
      stroke-dashoffset: 460;
    }

    .stage.is-playing .ecg-path {
      animation: ecgDraw 3.6s linear infinite;
    }

    @keyframes ecgDraw {
      0% {
        stroke-dashoffset: 460;
        opacity: 0;
      }
      12% {
        opacity: 1;
      }
      85% {
        opacity: 0.9;
      }
      100% {
        stroke-dashoffset: -460;
        opacity: 0;
      }
    }

    /* ==========================================================================
       5. COMMON LUXURY HUD (TOP BAR, COUNTER, ROTATING BADGE)
       ========================================================================== */
    .hud-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 24px 12px;
      pointer-events: none;
    }

    /* Brand Logo Wrapper */
    .brand-logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 58px;
    }

    .brand-logo-img {
      height: 58px;
      width: auto;
      max-width: 120px;
      object-fit: contain;
      filter: brightness(0) invert(1) drop-shadow(0 2px 8px rgba(0, 0, 0, 0.16));
      display: block;
    }

    /* Clean fallback if logo_transparent.png is not yet placed alongside HTML */
    .brand-logo-fallback {
      display: none;
      align-items: center;
      gap: 8px;
      color: #FFFFFF;
      text-align: right;
    }

    .brand-logo-wrap.is-fallback .brand-logo-img {
      display: none;
    }

    .brand-logo-wrap.is-fallback .brand-logo-fallback {
      display: inline-flex;
    }

    .fallback-monogram {
      font-weight: 900;
      font-size: 20px;
      letter-spacing: -0.03em;
      line-height: 1;
      padding: 5px 8px;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 10px;
    }

    .fallback-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .fallback-text strong {
      font-size: 11px;
      font-weight: 800;
    }

    .fallback-text span {
      font-size: 8.5px;
      font-weight: 600;
      opacity: 0.85;
      letter-spacing: 0.04em;
    }

    /* Top-left luxury pill tag ("NOV 11.11") */
    .hud-season-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #FFFFFF;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* Progress Bar Segments at very top */
    .hud-progress {
      position: absolute;
      top: 10px;
      left: 24px;
      right: 24px;
      z-index: 11;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      pointer-events: none;
    }

    .progress-track {
      height: 2.5px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.24);
      overflow: hidden;
    }

    .progress-fill {
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      transform-origin: right center;
      transform: scaleX(0);
    }

    .progress-track.is-done .progress-fill {
      transform: scaleX(1);
    }

    /* Bottom HUD: Counter on Bottom-Left, Circular Badge on Bottom-Right */
    .hud-bottom {
      position: absolute;
      bottom: 20px;
      left: 24px;
      right: 24px;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      pointer-events: none;
    }

    /* Bottom-Right Circular Badge (~64px) */
    .circular-badge {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .circular-badge-svg {
      width: 58px;
      height: 58px;
      animation: spinBadge 12s linear infinite;
    }

    .circular-badge-text {
      font-family: var(--font-main);
      font-size: 10.2px;
      font-weight: 800;
      fill: #1A1D24;
      direction: ltr;            /* FIX: RTL page direction made the text on the path collapse/disappear */
      unicode-bidi: isolate;
      letter-spacing: 0;         /* keep Arabic letters joined */
    }

    .circular-badge-dot {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--bg-current);
      transition: background-color 0.6s var(--ease-luxury);
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.06);
    }

    @keyframes spinBadge {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Bottom-Left Slide Counter ("01 / 04") */
    .slide-counter {
      direction: ltr;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: rgba(255, 255, 255, 0.92);
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(4px);
    }

    /* ==========================================================================
       6. SLIDE INNER CONTENT & HERO ELEMENTS
       ========================================================================== */
    .slide-inner {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    /* Accent Pill Tag */
    .slide-pill-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 16px;
      border-radius: 999px;
      background-color: var(--slide-accent, #2EC4B6);
      color: #0E1B1E;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
    }

    .slide-above-text {
      font-size: clamp(14px, 4.2cqw, 18px);
      font-weight: 700;
      color: rgba(255, 255, 255, 0.92);
      letter-spacing: 0.01em;
    }

    /* Hero Stage Wrapper (handles enter/exit blur-slide + idle float) */
    .hero-motion-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      will-change: transform, filter, opacity;
    }

    .hero-float-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      will-change: transform;
    }

    /* Idle vertical float after arrival */
    .stage.is-playing .slide.is-active .hero-float-wrap {
      animation: heroIdleFloat 3s ease-in-out infinite;
    }

    @keyframes heroIdleFloat {
      0%, 100% { transform: translateY(-8px); }
      50% { transform: translateY(8px); }
    }

    /* Hero Enter & Exit Motion Blur Transitions */
    .hero-enter-next {
      animation: heroInFromLeft 0.7s var(--ease-luxury) forwards;
    }

    .hero-exit-next {
      animation: heroOutToRight 0.65s var(--ease-luxury) forwards;
    }

    .hero-enter-prev {
      animation: heroInFromRight 0.7s var(--ease-luxury) forwards;
    }

    .hero-exit-prev {
      animation: heroOutToLeft 0.65s var(--ease-luxury) forwards;
    }

    @keyframes heroInFromLeft {
      0% {
        opacity: 0;
        transform: translateX(-34%) scale(0.86) rotate(-3deg);
        filter: blur(0px);
      }
      45% {
        opacity: 0.9;
        filter: blur(12px);
      }
      100% {
        opacity: 1;
        transform: translateX(0%) scale(1) rotate(0deg);
        filter: blur(0px);
      }
    }

    @keyframes heroOutToRight {
      0% {
        opacity: 1;
        transform: translateX(0%) scale(1) rotate(0deg);
        filter: blur(0px);
      }
      45% {
        opacity: 0.7;
        filter: blur(12px);
      }
      100% {
        opacity: 0;
        transform: translateX(34%) scale(0.88) rotate(3deg);
        filter: blur(2px);
      }
    }

    @keyframes heroInFromRight {
      0% {
        opacity: 0;
        transform: translateX(34%) scale(0.86) rotate(3deg);
        filter: blur(0px);
      }
      45% {
        opacity: 0.9;
        filter: blur(12px);
      }
      100% {
        opacity: 1;
        transform: translateX(0%) scale(1) rotate(0deg);
        filter: blur(0px);
      }
    }

    @keyframes heroOutToLeft {
      0% {
        opacity: 1;
        transform: translateX(0%) scale(1) rotate(0deg);
        filter: blur(0px);
      }
      45% {
        opacity: 0.7;
        filter: blur(12px);
      }
      100% {
        opacity: 0;
        transform: translateX(-34%) scale(0.88) rotate(-3deg);
        filter: blur(2px);
      }
    }

    /* SLIDE 1 GIANT "11.11" WITH GLOSSY SWEEP */
    .hero-1111 {
      position: relative;
      direction: ltr;
      font-size: clamp(92px, 34cqw, 148px);
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: -0.055em;
      color: #FFFFFF;
      text-shadow:
        0 14px 32px rgba(0, 0, 0, 0.22),
        0 2px 0 rgba(255, 255, 255, 0.25);
      background: linear-gradient(
        115deg,
        #FFFFFF 0%,
        #FFFFFF 38%,
        rgba(255, 255, 255, 0.55) 46%,
        #FFFFFF 52%,
        #FFFFFF 100%
      );
      background-size: 240% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      padding: 6px 4px;
    }

    .stage.is-playing .slide.is-active .hero-1111 {
      animation: glossySweep 3.2s ease-in-out infinite;
    }

    @keyframes glossySweep {
      0%, 20% { background-position: 130% 0; }
      65%, 100% { background-position: -40% 0; }
    }

    /* SLIDE 2 GIANT "25 ريال" */
    .hero-25-wrap {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
      line-height: 0.9;
    }

    .hero-25-num {
      direction: ltr;
      font-size: clamp(112px, 38cqw, 168px);
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #FFFFFF;
      text-shadow: 0 16px 34px rgba(0, 0, 0, 0.22);
    }

    .hero-25-unit {
      font-size: clamp(30px, 9.5cqw, 44px);
      font-weight: 900;
      color: var(--slide-accent, #2EC4B6);
      text-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    }

    /* SLIDE 3 GIANT COUNTER "10 -> 70%" */
    .hero-counter-wrap {
      direction: ltr;
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      line-height: 0.9;
      transform-origin: center center;
    }

    .hero-counter-wrap.is-popped {
      animation: counterPop 0.52s var(--ease-pop) forwards;
    }

    @keyframes counterPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.13); }
      100% { transform: scale(1); }
    }

    .hero-counter-num {
      font-size: clamp(110px, 37cqw, 164px);
      font-weight: 900;
      letter-spacing: -0.045em;
      color: #FFFFFF;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 16px 34px rgba(0, 0, 0, 0.22);
    }

    .hero-counter-pct {
      font-size: clamp(54px, 18cqw, 78px);
      font-weight: 900;
      color: var(--slide-accent, #FFD166);
      margin-left: 2px;
      text-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
    }

    /* SLIDE 4 BIG CENTER LOGO & TABBY/TAMARA PILLS */
    .hero-big-logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
    }

    .hero-big-logo-img {
      width: clamp(165px, 48cqw, 225px);
      height: auto;
      max-height: 155px;
      object-fit: contain;
      filter: brightness(0) invert(1) drop-shadow(0 14px 28px rgba(0, 0, 0, 0.24));
    }

    .hero-big-logo-fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #FFFFFF;
    }

    .hero-big-logo-wrap.is-fallback .hero-big-logo-img {
      display: none;
    }

    .hero-big-logo-wrap.is-fallback .hero-big-logo-fallback {
      display: flex;
    }

    .hero-big-logo-fallback .ak-badge {
      font-size: 46px;
      font-weight: 900;
      line-height: 1;
      padding: 12px 22px;
      border-radius: 22px;
      border: 2.5px solid rgba(255, 255, 255, 0.9);
      letter-spacing: -0.03em;
    }

    .hero-big-logo-fallback .ak-ar {
      font-size: 18px;
      font-weight: 800;
    }

    .hero-big-logo-fallback .ak-en {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      opacity: 0.85;
      text-transform: uppercase;
    }

    /* Tabby & Tamara White Rounded Pills */
    .payment-pills-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .payment-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 112px;
      height: 44px;
      padding: 8px 20px;
      border-radius: 999px;
      background: #FFFFFF;
      color: #1A1D24;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.45s var(--ease-luxury), transform 0.45s var(--ease-luxury);
    }

    .payment-pill.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Empty/ready <img> slot for official Tabby/Tamara logos later */
    .payment-logo-slot {
      display: none;
      height: 20px;
      width: auto;
      object-fit: contain;
    }

    .payment-logo-slot[src]:not([src=""]) {
      display: inline-block;
    }

    /* Official Tabby / Tamara badges: same size, no white pill behind them */
    .payment-pill--img {
      background: transparent;
      box-shadow: none;
      padding: 0;
      min-width: 0;
      height: auto;
      border-radius: 0;
    }
    .payment-pill--img .payment-logo-slot {
      display: block;
      height: auto;
      width: clamp(125px, 40cqw, 190px);
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.22));
    }

    /* Phone Contact Line */
    .contact-line {
      margin-top: 4px;
      font-size: clamp(14px, 4cqw, 16px);
      font-weight: 700;
      color: rgba(255, 255, 255, 0.95);
      background: rgba(0, 0, 0, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 7px 18px;
      border-radius: 999px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.45s var(--ease-luxury) 0.15s, transform 0.45s var(--ease-luxury) 0.15s;
    }

    .contact-line.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .contact-phone {
      direction: ltr;
      display: inline-block;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: var(--slide-accent, #2EC4B6);
      margin-right: 4px;
    }

    /* ==========================================================================
       7. WORD-BY-WORD ARABIC TITLE & SUBTITLE ANIMATIONS
       ========================================================================== */
    .slide-title {
      font-size: clamp(26px, 7.8cqw, 36px);
      font-weight: 800;
      line-height: 1.32;
      color: #FFFFFF;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      max-width: 92%;
    }

    .slide-subtitle {
      font-size: clamp(16px, 4.6cqw, 20px);
      font-weight: 600;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.9);
    }

    /* Individual Word Span (preserves Arabic letter shaping & ligatures) */
    .word {
      display: inline-block;
      opacity: 0;
      filter: blur(8px);
      transform: translateY(16px);
      will-change: opacity, filter, transform;
    }

    .word.is-in {
      animation: wordReveal 0.55s var(--ease-luxury) forwards;
    }

    .word.is-out {
      animation: wordExit 0.28s var(--ease-luxury) forwards;
    }

    @keyframes wordReveal {
      0% {
        opacity: 0;
        filter: blur(8px);
        transform: translateY(16px);
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: translateY(0px);
      }
    }

    @keyframes wordExit {
      0% {
        opacity: 1;
        filter: blur(0px);
        transform: translateY(0px);
      }
      100% {
        opacity: 0;
        filter: blur(6px);
        transform: translateY(-10px);
      }
    }

    /* ==========================================================================
       8. START OVERLAY (TAP TO PLAY WITH AUDIO)
       ========================================================================== */
    .start-overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: rgba(12, 14, 18, 0.58);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      cursor: pointer;
      transition: opacity 0.45s var(--ease-luxury), visibility 0.45s;
    }

    .start-overlay.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .play-btn-ring {
      position: relative;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: #2EC4B6;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow:
        0 16px 38px rgba(46, 196, 182, 0.48),
        0 0 0 8px rgba(46, 196, 182, 0.22);
      transition: transform 0.25s var(--ease-luxury), box-shadow 0.25s var(--ease-luxury);
    }

    .play-btn-ring::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px solid rgba(46, 196, 182, 0.55);
      animation: pulseRing 2s ease-out infinite;
    }

    @keyframes pulseRing {
      0% { transform: scale(0.92); opacity: 0.9; }
      100% { transform: scale(1.32); opacity: 0; }
    }

    .start-overlay:hover .play-btn-ring,
    .start-overlay:active .play-btn-ring {
      transform: scale(1.06);
    }

    .play-icon {
      width: 34px;
      height: 34px;
      fill: #FFFFFF;
      margin-left: -4px; /* Optical center for play triangle */
    }

    .start-label {
      font-family: var(--font-main);
      font-size: 17px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    }

    /* ==========================================================================
       9. REDUCED MOTION ACCESSIBILITY
       ========================================================================== */
    @media (prefers-reduced-motion: reduce) {
      .slide.is-entering,
      .slide.is-entering-reverse {
        animation: plainFadeIn 0.4s ease forwards;
        clip-path: none !important;
      }

      @keyframes plainFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .hero-enter-next,
      .hero-exit-next,
      .hero-enter-prev,
      .hero-exit-prev {
        animation: none !important;
        filter: none !important;
        transform: none !important;
      }

      .stage.is-playing .slide.is-active .hero-float-wrap,
      .circular-badge-svg,
      .decor-circle,
      .decor-plus,
      .ecg-path {
        animation: none !important;
      }

      .word {
        filter: none !important;
        transform: none !important;
      }
    }
  </style>
</head>

    /* ==========================================================================
       PROCEDURAL WEB AUDIO ENGINE (PER-SLIDE GAIN BUS + ZERO EXTERNAL FILES)
       ========================================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.currentBus = null;
        this.noiseBuffer = null;
      }

      initContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
            this._buildNoiseBuffer();
          }
        }
        return this.ctx;
      }

      _buildNoiseBuffer() {
        if (!this.ctx) return;
        const sampleRate = this.ctx.sampleRate;
        const length = sampleRate * 1.2;
        const buffer = this.ctx.createBuffer(1, length, sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        this.noiseBuffer = buffer;
      }

      /**
       * Creates a dedicated GainNode bus for the incoming slide and
       * rapidly fades out & disconnects the previous slide's bus (~30ms)
       * so scheduled audio never overlaps across transitions.
       */
      rotateSlideBus() {
        if (!this.ctx) return null;
        const now = this.ctx.currentTime;

        if (this.currentBus) {
          const oldBus = this.currentBus;
          try {
            oldBus.gain.cancelScheduledValues(now);
            oldBus.gain.setValueAtTime(oldBus.gain.value, now);
            oldBus.gain.linearRampToValueAtTime(0.0001, now + 0.03);
            setTimeout(() => {
              try { oldBus.disconnect(); } catch (e) {}
            }, 45);
          } catch (e) {}
        }

        const newBus = this.ctx.createGain();
        newBus.gain.setValueAtTime(0.85, now);
        newBus.connect(this.ctx.destination);
        this.currentBus = newBus;
        return newBus;
      }

      /**
       * Filtered white-noise diagonal wipe whoosh + warm low thump
       */
      playWhoosh(bus) {
        if (!this.ctx || !bus || this.ctx.state !== 'running' || !this.noiseBuffer) return;
        const now = this.ctx.currentTime;

        // 1. Filtered noise sweep
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.setValueAtTime(1.8, now);
        filter.frequency.setValueAtTime(220, now);
        filter.frequency.exponentialRampToValueAtTime(1650, now + 0.28);
        filter.frequency.exponentialRampToValueAtTime(360, now + 0.65);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.24, now + 0.22);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.68);

        src.connect(filter);
        filter.connect(gain);
        gain.connect(bus);

        src.start(now);
        src.stop(now + 0.7);

        // 2. Subtle luxury sub-pulse
        const sub = this.ctx.createOscillator();
        const subGain = this.ctx.createGain();
        sub.type = 'sine';
        sub.frequency.setValueAtTime(115, now + 0.05);
        sub.frequency.exponentialRampToValueAtTime(48, now + 0.42);

        subGain.gain.setValueAtTime(0.001, now + 0.05);
        subGain.gain.linearRampToValueAtTime(0.18, now + 0.1);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

        sub.connect(subGain);
        subGain.connect(bus);
        sub.start(now + 0.05);
        sub.stop(now + 0.46);
      }

      /**
       * Soft tactile pop when Arabic title words land
       */
      playTitlePop(bus, delaySec = 0) {
        if (!this.ctx || !bus || this.ctx.state !== 'running') return;
        const t = this.ctx.currentTime + delaySec;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, t);
        osc.frequency.exponentialRampToValueAtTime(290, t + 0.085);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.11, t + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.095);

        osc.connect(gain);
        gain.connect(bus);
        osc.start(t);
        osc.stop(t + 0.1);
      }

      /**
       * Rising pitched tick for Slide 3's 10 -> 70% count-up
       */
      playCountTick(bus, progress01) {
        if (!this.ctx || !bus || this.ctx.state !== 'running') return;
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';

        // Pitch ascends smoothly from 380Hz to 920Hz
        const freq = 380 + progress01 * 540;
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.12, now + 0.035);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.075, now + 0.006);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.042);

        osc.connect(gain);
        gain.connect(bus);
        osc.start(now);
        osc.stop(now + 0.045);
      }

      /**
       * Bright celebratory chime when 70% lands
       */
      playCounterFinish(bus) {
        if (!this.ctx || !bus || this.ctx.state !== 'running') return;
        const now = this.ctx.currentTime;
        const notes = [587.33, 880, 1174.66]; // D5, A5, D6

        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const start = now + idx * 0.035;
          osc.frequency.setValueAtTime(freq, start);

          gain.gain.setValueAtTime(0.001, start);
          gain.gain.linearRampToValueAtTime(0.09, start + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.36);

          osc.connect(gain);
          gain.connect(bus);
          osc.start(start);
          osc.stop(start + 0.38);
        });
      }
    }

    /* ==========================================================================
       MAIN AD CONTROLLER
       ========================================================================== */
    class MedicalAdPlayer {
      constructor() {
        this.stage = document.getElementById('stage');
        this.viewportWrapper = document.getElementById('viewportWrapper');
        this.slidesContainer = document.getElementById('slidesContainer');
        this.hudProgress = document.getElementById('hudProgress');
        this.slideCounter = document.getElementById('slideCounter');
        this.startOverlay = document.getElementById('startOverlay');
        this.topLogoWrap = document.getElementById('topLogoWrap');
        this.topLogoImg = document.getElementById('topLogoImg');

        this.sound = new SoundEngine();
        this.prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        this.currentIndex = 0;
        this.isStarted = false;
        this.isTransitioning = false;

        // Active timers & RAF handles for clean cancellation
        this.autoAdvanceTimer = null;
        this.slideStartTime = 0;
        this.remainingSlideTime = SLIDE_DURATION_MS;
        this.progressRaf = null;
        this.transitionUnlockTimer = null;
        this.transitionCleanupTimer = null;
        this.countUpRaf = null;
        this.scheduledTimeouts = [];

        this.slideElements = [];
        this.progressFills = [];

        this._setupLogos();
        this._buildDOM();
        this._bindEvents();
        this._renderInitialStaticState();
        this._attemptAutostart();
      }

      _setupLogos() {
        this.topLogoImg.src = LOGO_SRC;
        this.topLogoImg.onerror = () => {
          this.topLogoWrap.classList.add('is-fallback');
        };
      }

      /**
       * Splits an Arabic string into word spans while preserving spaces and
       * keeping all letters inside each word connected properly.
       */
      _buildWordSpansHTML(text) {
        if (!text) return '';
        const words = text.trim().split(/\s+/);
        return words
          .map((word) => `<span class="word">${word}</span>`)
          .join(' ');
      }

      _buildDOM() {
        // 1. Progress bars
        this.hudProgress.innerHTML = '';
        SLIDES.forEach(() => {
          const track = document.createElement('div');
          track.className = 'progress-track';
          const fill = document.createElement('div');
          fill.className = 'progress-fill';
          track.appendChild(fill);
          this.hudProgress.appendChild(track);
          this.progressFills.push(fill);
        });

        // 2. Slides
        this.slidesContainer.innerHTML = '';
        SLIDES.forEach((cfg, index) => {
          const slide = document.createElement('section');
          slide.className = 'slide';
          slide.dataset.index = index;
          slide.style.setProperty('--slide-bg', cfg.bg);
          slide.style.setProperty('--slide-accent', cfg.accent);

          let heroHTML = '';
          if (cfg.heroType === 'giant-text') {
            heroHTML = `<div class="hero-1111">${cfg.heroText}</div>`;
          } else if (cfg.heroType === 'currency-offer') {
            heroHTML = `
              <div class="hero-25-wrap">
                <span class="hero-25-num">${cfg.heroNumber}</span>
                <span class="hero-25-unit">${cfg.heroUnit}</span>
              </div>
            `;
          } else if (cfg.heroType === 'count-up') {
            heroHTML = `
              <div class="hero-counter-wrap" data-counter-wrap>
                <span class="hero-counter-num" data-counter-num>${cfg.countFrom}</span>
                <span class="hero-counter-pct">${cfg.countSuffix}</span>
              </div>
            `;
          } else if (cfg.heroType === 'big-logo') {
            heroHTML = `
              <div class="hero-big-logo-wrap" data-big-logo-wrap>
                <img class="hero-big-logo-img" src="${LOGO_SRC}" alt="مجمع أنوار خيبر الطبي" />
                <div class="hero-big-logo-fallback" aria-hidden="true">
                  <span class="ak-badge">AK</span>
                  <span class="ak-ar">مجمع أنوار خيبر الطبي</span>
                  <span class="ak-en">Anwar Kheiber Medical Centre</span>
                </div>
              </div>
            `;
          }

          let extraBottomHTML = '';
          if (cfg.pills && cfg.pills.length) {
            const pillsInner = cfg.pills
              .map(
                (p) => `
                  <div class="payment-pill${p.logoSrc ? ' payment-pill--img' : ''}" data-pill>
                    <img class="payment-logo-slot" src="${p.logoSrc || ''}" alt="${p.logoSrc ? p.label : ''}" />
                    ${p.logoSrc ? '' : `<span>${p.label}</span>`}
                  </div>
                `
              )
              .join('');
            extraBottomHTML += `<div class="payment-pills-row">${pillsInner}</div>`;
          }

          if (cfg.contactPhone) {
            extraBottomHTML += `
              <div class="contact-line" data-contact>
                <span>${cfg.contactLabel}</span>
                <span class="contact-phone">${cfg.contactPhone}</span>
              </div>
            `;
          }

          slide.innerHTML = `
            <div class="slide-inner">
              ${cfg.topTag ? `<div class="slide-pill-tag">${cfg.topTag}</div>` : ''}
              ${cfg.aboveHero ? `<div class="slide-above-text">${cfg.aboveHero}</div>` : ''}
              <div class="hero-motion-wrap" data-hero-motion>
                <div class="hero-float-wrap">
                  ${heroHTML}
                </div>
              </div>
              <h2 class="slide-title" data-title>${this._buildWordSpansHTML(cfg.title)}</h2>
              ${cfg.subtitle ? `<p class="slide-subtitle" data-subtitle>${this._buildWordSpansHTML(cfg.subtitle)}</p>` : ''}
              ${extraBottomHTML}
            </div>
          `;

          // Handle fallback on slide 4's big logo if local image isn't found
          const bigImg = slide.querySelector('.hero-big-logo-img');
          if (bigImg) {
            bigImg.onerror = () => {
              const wrap = slide.querySelector('[data-big-logo-wrap]');
              if (wrap) wrap.classList.add('is-fallback');
            };
          }

          this.slidesContainer.appendChild(slide);
          this.slideElements.push(slide);
        });
      }

      /**
       * Renders Slide 1 completely static before user tap (no animations, no count-up)
       */
      _renderInitialStaticState() {
        const firstSlide = this.slideElements[0];
        firstSlide.classList.add('is-active');
        this._syncThemeColors(0);
        this._updateCounterUI(0);
      }

      /**
       * Attempts to autostart if the browser already permits an active AudioContext.
       * Otherwise shows the blurred start overlay.
       */
      _attemptAutostart() {
        try {
          const ctx = this.sound.initContext();
          if (ctx && ctx.state === 'running') {
            this.startOverlay.classList.add('is-hidden');
            requestAnimationFrame(() => this._launchFromZero());
            return;
          }
        } catch (e) {}
      }

      _handleStartTap() {
        if (this.isStarted) return;
        const ctx = this.sound.initContext();

        const begin = () => {
          this.startOverlay.classList.add('is-hidden');
          requestAnimationFrame(() => {
            this._launchFromZero();
          });
        };

        if (ctx && ctx.state !== 'running') {
          ctx.resume().then(begin).catch(begin);
        } else {
          begin();
        }
      }

      _launchFromZero() {
        if (this.isStarted) return;
        this.isStarted = true;
        this.stage.classList.add('is-playing');

        const bus = this.sound.rotateSlideBus();
        this._activateSlideContent(0, bus, false);
        this._startAutoTimer(SLIDE_DURATION_MS);
      }

      _syncThemeColors(index) {
        const cfg = SLIDES[index];
        document.documentElement.style.setProperty('--bg-current', cfg.bg);
        document.documentElement.style.setProperty('--accent-current', cfg.accent);
        this.stage.style.backgroundColor = cfg.bg;
      }

      _updateCounterUI(index) {
        const currentStr = String(index + 1).padStart(2, '0');
        const totalStr = String(SLIDES.length).padStart(2, '0');
        this.slideCounter.textContent = `${currentStr} / ${totalStr}`;

        this.progressFills.forEach((fill, i) => {
          const track = fill.parentElement;
          if (i < index) {
            track.classList.add('is-done');
            fill.style.transform = 'scaleX(1)';
          } else {
            track.classList.remove('is-done');
            fill.style.transform = 'scaleX(0)';
          }
        });
      }

      /**
       * Cancels all pending animations, timeouts, and RAF loops cleanly
       */
      _clearScheduledWork() {
        clearTimeout(this.autoAdvanceTimer);
        clearTimeout(this.transitionUnlockTimer);
        clearTimeout(this.transitionCleanupTimer);
        cancelAnimationFrame(this.progressRaf);
        cancelAnimationFrame(this.countUpRaf);

        while (this.scheduledTimeouts.length) {
          clearTimeout(this.scheduledTimeouts.pop());
        }
      }

      _scheduleTimeout(fn, delay) {
        const id = setTimeout(fn, delay);
        this.scheduledTimeouts.push(id);
        return id;
      }

      /**
       * Animates word-by-word title/subtitle entrance + slide-specific mechanics
       */
      _activateSlideContent(index, bus, playWhooshSound = true) {
        const slide = this.slideElements[index];
        const cfg = SLIDES[index];

        if (playWhooshSound) {
          this.sound.playWhoosh(bus);
        }

        // Reset & animate word spans for title and subtitle
        const words = slide.querySelectorAll('.word');
        words.forEach((w) => {
          w.classList.remove('is-in', 'is-out');
          void w.offsetWidth; // Force reflow
        });

        const baseDelay = playWhooshSound ? 240 : 80;
        words.forEach((w, idx) => {
          const delay = baseDelay + idx * 80;
          this._scheduleTimeout(() => {
            w.classList.add('is-in');
            if (idx === 0 || idx === words.length - 1) {
              this.sound.playTitlePop(bus, 0);
            }
          }, delay);
        });

        // Slide 3: Count-up animation from 10 to 70% over ~1.6s with pop at end
        if (cfg.heroType === 'count-up') {
          const numEl = slide.querySelector('[data-counter-num]');
          const wrapEl = slide.querySelector('[data-counter-wrap]');
          if (numEl && wrapEl) {
            numEl.textContent = cfg.countFrom;
            wrapEl.classList.remove('is-popped');

            const startDelay = playWhooshSound ? 220 : 120;
            this._scheduleTimeout(() => {
              const startTime = performance.now();
              const duration = cfg.countDuration || 1600;
              const from = cfg.countFrom;
              const to = cfg.countTo;
              let lastVal = from;

              const step = (now) => {
                const elapsed = now - startTime;
                const rawT = Math.min(1, elapsed / duration);
                // Smooth ease-out cubic so numbers decelerate naturally into 70
                const easedT = 1 - Math.pow(1 - rawT, 3);
                const currentVal = Math.round(from + (to - from) * easedT);

                if (currentVal !== lastVal) {
                  numEl.textContent = currentVal;
                  // Play ascending ticks every 3 steps so audio stays crisp
                  if ((currentVal - from) % 3 === 0 || currentVal === to) {
                    this.sound.playCountTick(bus, rawT);
                  }
                  lastVal = currentVal;
                }

                if (rawT < 1) {
                  this.countUpRaf = requestAnimationFrame(step);
                } else {
                  numEl.textContent = to;
                  wrapEl.classList.add('is-popped');
                  this.sound.playCounterFinish(bus);
                }
              };

              this.countUpRaf = requestAnimationFrame(step);
            }, startDelay);
          }
        }

        // Slide 4: Reveal Tabby / Tamara pills & contact phone
        if (cfg.heroType === 'big-logo') {
          const pills = slide.querySelectorAll('[data-pill]');
          const contact = slide.querySelector('[data-contact]');
          pills.forEach((p) => p.classList.remove('is-visible'));
          if (contact) contact.classList.remove('is-visible');

          const revealBase = playWhooshSound ? 380 : 240;
          pills.forEach((pill, i) => {
            this._scheduleTimeout(() => {
              pill.classList.add('is-visible');
            }, revealBase + i * 110);
          });

          if (contact) {
            this._scheduleTimeout(() => {
              contact.classList.add('is-visible');
            }, revealBase + 220);
          }
        }
      }

      /**
       * Transitions cleanly to target slide index with diagonal wipe & motion blur
       */
      goToSlide(targetIndex, direction = 'next') {
        if (!this.isStarted) return;
        // Ignore clicks/swipes during the first 650ms of an active transition
        if (this.isTransitioning) return;

        const total = SLIDES.length;
        const nextIndex = (targetIndex + total) % total;
        if (nextIndex === this.currentIndex) return;

        // Cancel any lingering timers/animations and rotate audio bus
        this._clearScheduledWork();
        const bus = this.sound.rotateSlideBus();

        this.isTransitioning = true;
        this.transitionUnlockTimer = setTimeout(() => {
          this.isTransitioning = false;
        }, TRANSITION_LOCK_MS);

        const prevIndex = this.currentIndex;
        this.currentIndex = nextIndex;

        // Clean up any leftover classes on all slides first
        this.slideElements.forEach((el, idx) => {
          if (idx !== prevIndex && idx !== nextIndex) {
            el.className = 'slide';
          }
          const hero = el.querySelector('[data-hero-motion]');
          if (hero) {
            hero.classList.remove(
              'hero-enter-next',
              'hero-exit-next',
              'hero-enter-prev',
              'hero-exit-prev'
            );
          }
        });

        const oldSlide = this.slideElements[prevIndex];
        const newSlide = this.slideElements[nextIndex];

        // Outgoing words blur/fade out quickly
        oldSlide.querySelectorAll('.word').forEach((w) => {
          w.classList.remove('is-in');
          w.classList.add('is-out');
        });

        // Apply diagonal wipe & hero motion blur classes
        oldSlide.className = 'slide is-outgoing';
        newSlide.className =
          direction === 'prev' ? 'slide is-entering-reverse' : 'slide is-entering';

        const oldHero = oldSlide.querySelector('[data-hero-motion]');
        const newHero = newSlide.querySelector('[data-hero-motion]');

        if (oldHero) {
          void oldHero.offsetWidth;
          oldHero.classList.add(direction === 'prev' ? 'hero-exit-prev' : 'hero-exit-next');
        }
        if (newHero) {
          void newHero.offsetWidth;
          newHero.classList.add(direction === 'prev' ? 'hero-enter-prev' : 'hero-enter-next');
        }

        // Update outer frame colors & bottom HUD
        this._syncThemeColors(nextIndex);
        this._updateCounterUI(nextIndex);

        // Trigger incoming slide animations & sounds
        this._activateSlideContent(nextIndex, bus, true);

        // Finalize layer classes after wipe completes
        this.transitionCleanupTimer = setTimeout(() => {
          oldSlide.className = 'slide';
          oldSlide.querySelectorAll('.word').forEach((w) => w.classList.remove('is-out'));
          if (oldHero) {
            oldHero.classList.remove('hero-exit-next', 'hero-exit-prev');
          }

          newSlide.className = 'slide is-active';
          if (newHero) {
            newHero.classList.remove('hero-enter-next', 'hero-enter-prev');
          }
        }, TRANSITION_TOTAL_MS);

        // Reset 4s auto-advance timer
        this._startAutoTimer(SLIDE_DURATION_MS);
      }

      nextSlide() {
        this.goToSlide(this.currentIndex + 1, 'next');
      }

      prevSlide() {
        this.goToSlide(this.currentIndex - 1, 'prev');
      }

      _startAutoTimer(durationMs) {
        clearTimeout(this.autoAdvanceTimer);
        cancelAnimationFrame(this.progressRaf);

        this.remainingSlideTime = durationMs;
        this.slideStartTime = performance.now();

        const activeFill = this.progressFills[this.currentIndex];
        const elapsedBeforeResume = SLIDE_DURATION_MS - durationMs;

        const updateProgress = (now) => {
          if (document.hidden || !this.isStarted) return;
          const elapsed = elapsedBeforeResume + (now - this.slideStartTime);
          const ratio = Math.min(1, Math.max(0, elapsed / SLIDE_DURATION_MS));
          if (activeFill) {
            activeFill.style.transform = `scaleX(${ratio})`;
          }
          if (ratio < 1) {
            this.progressRaf = requestAnimationFrame(updateProgress);
          }
        };

        this.progressRaf = requestAnimationFrame(updateProgress);

        this.autoAdvanceTimer = setTimeout(() => {
          this.nextSlide();
        }, durationMs);
      }

      _pauseTimer() {
        if (!this.isStarted) return;
        clearTimeout(this.autoAdvanceTimer);
        cancelAnimationFrame(this.progressRaf);
        const elapsed = performance.now() - this.slideStartTime;
        this.remainingSlideTime = Math.max(250, this.remainingSlideTime - elapsed);
      }

      _resumeTimer() {
        if (!this.isStarted || document.hidden) return;
        this._startAutoTimer(this.remainingSlideTime);
      }

      _bindEvents() {
        // Start overlay tap/click/keyboard
        this.startOverlay.addEventListener('click', () => this._handleStartTap());
        this.startOverlay.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            this._handleStartTap();
          }
        });

        // Pause when tab is hidden, resume when visible
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            this._pauseTimer();
          } else {
            this._resumeTimer();
          }
        });

        // Keyboard ArrowLeft / ArrowRight support
        window.addEventListener('keydown', (e) => {
          if (!this.isStarted) return;
          if (e.key === 'ArrowLeft') {
            e.preventDefault();
            this.nextSlide();
          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            this.prevSlide();
          }
        });

        // Touch swipe & mouse drag support
        let pointerStartX = 0;
        let pointerStartY = 0;
        let isPointerDown = false;

        const onPointerStart = (x, y) => {
          if (!this.isStarted) return;
          isPointerDown = true;
          pointerStartX = x;
          pointerStartY = y;
        };

        const onPointerEnd = (x, y) => {
          if (!isPointerDown || !this.isStarted) return;
          isPointerDown = false;

          const dx = x - pointerStartX;
          const dy = y - pointerStartY;

          // Horizontal swipe threshold (42px)
          if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy)) {
            if (dx < 0) {
              // Swipe left -> forward
              this.nextSlide();
            } else {
              // Swipe right -> backward
              this.prevSlide();
            }
          }
        };

        this.stage.addEventListener(
          'touchstart',
          (e) => {
            if (e.touches.length === 1) {
              onPointerStart(e.touches[0].clientX, e.touches[0].clientY);
            }
          },
          { passive: true }
        );

        this.stage.addEventListener(
          'touchend',
          (e) => {
            if (e.changedTouches.length === 1) {
              onPointerEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }
          },
          { passive: true }
        );

        this.stage.addEventListener('mousedown', (e) => {
          if (e.button === 0) onPointerStart(e.clientX, e.clientY);
        });

        window.addEventListener('mouseup', (e) => {
          if (isPointerDown) onPointerEnd(e.clientX, e.clientY);
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      new MedicalAdPlayer();
    });
  </script>
</body>
</html>
